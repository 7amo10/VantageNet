# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = %(here)s/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use for timestamp in file_template
# timezone = UTC

# Version path separator; As mentioned above, this is the character used to split
# version_locations. Default: os.pathsep. Example:  
# version_path_separator = :

# Max length of characters to apply to the
# "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification; This defaults
# to migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = %(here)s/migrations/versions

# Output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Database URL
# Can be overridden with DATABASE_URL environment variable
sqlalchemy.url = postgresql://vantage:vantage_secret@localhost:5434/vantage_db


[post_write_hooks]
# Post-write hooks are run after the migration file is written
# format using "black" - use the console_scripts runner
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
