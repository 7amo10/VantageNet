# ========================================
# VantageNet Redis Configuration
# ========================================
# Optimized for Redis Streams with persistence
# Max memory: 512MB with LRU eviction
# Persistence: AOF enabled for durability
# ========================================

# ========================================
# NETWORK
# ========================================
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# ========================================
# GENERAL
# ========================================
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# ========================================
# MEMORY MANAGEMENT
# ========================================
# Set maximum memory to 512MB
maxmemory 512mb

# Use allkeys-lru eviction policy
# Evict any key using LRU when maxmemory is reached
maxmemory-policy allkeys-lru

# Number of keys to sample for LRU
maxmemory-samples 5

# ========================================
# PERSISTENCE - AOF ENABLED
# ========================================
# Enable RDB snapshots as base for AOF
save 900 1
save 300 10
save 60 10000

# Enable appendonly persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Still configure AOF in case it's enabled later
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ========================================
# REPLICATION
# ========================================
# Not using replication in initial setup
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no

# ========================================
# SECURITY
# ========================================
# No password in development
# requirepass foobared

# ========================================
# CLIENTS
# ========================================
# Maximum number of connected clients
maxclients 10000

# ========================================
# SLOW LOG
# ========================================
# Log queries slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========================================
# LATENCY MONITORING
# ========================================
latency-monitor-threshold 100

# ========================================
# EVENT NOTIFICATION
# ========================================
# Enable keyspace notifications for monitoring
notify-keyspace-events ""

# ========================================
# ADVANCED CONFIG
# ========================================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ========================================
# STREAM CONFIGURATION NOTES
# ========================================
# This Redis instance will handle 4 main streams:
# 
# 1. emotion:frames:{camera_id} - Raw video frames from ingestion
#    - Produced by: video-ingestion service
#    - Consumed by: emotion-detection service
#    - Expected rate: 10-30 fps per camera
#    - Data size: ~100KB per frame (JPEG encoded)
#
# 2. emotion:results:{camera_id} - Detected emotion results
#    - Produced by: emotion-detection service
#    - Consumed by: sentiment-analysis service
#    - Expected rate: 10-30 messages/sec per camera
#    - Data size: ~500 bytes per message (JSON)
#
# 3. sentiment:crowd - Aggregated crowd sentiment
#    - Produced by: sentiment-analysis service
#    - Consumed by: api-gateway service (WebSocket broadcast)
#    - Expected rate: 1 message/sec (aggregated)
#    - Data size: ~1KB per message (JSON)
#
# 4. alerts:events - System alerts and notifications
#    - Produced by: sentiment-analysis service (rules engine)
#    - Consumed by: api-gateway service
#    - Expected rate: Variable (0-10 messages/min)
#    - Data size: ~2KB per message (JSON with context)
#
# Consumer groups will be created for each service to enable
# horizontal scaling and at-least-once delivery guarantees.
#
# Stream retention is handled by maxmemory policy (allkeys-lru),
# which will automatically evict oldest messages when memory limit
# is reached. This is suitable for real-time streaming where
# historical data is persisted to PostgreSQL.
# ========================================
