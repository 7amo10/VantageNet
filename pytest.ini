[pytest]
# Pytest configuration for VantageNet

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external services
    e2e: marks end-to-end tests
    asyncio: marks tests as async

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Async support
asyncio_mode = auto

# Coverage options (when using --cov)
[coverage:run]
source = services/emotion-detection/app
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
